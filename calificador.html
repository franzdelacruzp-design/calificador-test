<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lector de hojas</title>
<style>
  html, body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
  .panel { padding: 12px; max-width: 700px; margin: auto; background: white; }
  .campo { display: block; margin-top: 10px; font-weight: bold; }
  input, select { font-size: 16px; padding: 8px; width: 100%; box-sizing: border-box; }
  button { font-size: 17px; padding: 12px; margin-top: 12px; width: 100%; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer;}
  button:active { background: #115293; }
  #mensaje { margin-top: 10px; font-weight: bold; }
  
  #visor { display: none; max-width: 700px; margin: auto; padding: 8px; background: white; }
  
  /* AQUÍ ESTÁ EL TRUCO PARA ACHICAR LA CÁMARA: max-height 45vh */
  #lienzo { width: 100%; max-height: 45vh; object-fit: contain; background: #000; display: block; border-radius: 8px; margin-bottom: 10px; }
  
  .estado { padding: 8px; font-weight: bold; text-align: center; color: white; margin-bottom: 6px; border-radius: 6px; }
  .estado.bueno { background: #2e7d32; }
  .estado.medio { background: #757575; }
  .estado.malo { background: #c62828; }
  #dni { font-size: 24px; font-weight: bold; letter-spacing: 3px; margin: 5px 0; }
  #aviso { color: #c62828; font-weight: bold; font-size: 14px; }
  #resumen { margin: 6px 0; font-size: 14px; }
  .c { display: inline-block; padding: 3px 6px; margin: 2px; border-radius: 6px; font-size: 14px; background: #eee; }
  .c.ok { background: #d6f5d6; }
  .c.bl { background: #eee; color: #777; }
  .c.do { background: #ffd6d6; }
  .c.du { background: #ffe9c2; }
  #dudas { white-space: pre-wrap; font-size: 13px; }
  
  .controles-camara { display: flex; gap: 10px; }
  .controles-camara button { margin-top: 0; }
</style>
<script src="layout.js"></script>
<script src="lector.js"></script>
</head>
<body>
<div class="panel" id="panelConfig">
  <h2>Lector de Hojas</h2>
  
  <label class="campo">PIN de creador</label>
  <input id="pin" type="password">
  <button onclick="cargarLista()">1. Cargar lista de exámenes</button>
  
  <label class="campo">Examen</label>
  <select id="examen"></select>

  <label class="campo">Cámara del celular</label>
  <select id="listaCamaras">
    <option value="">Cargando cámaras...</option>
  </select>

  <button onclick="iniciar()">2. Iniciar cámara</button>
  <div id="mensaje"></div>
</div>

<div id="visor">
  <div id="nombreExamen" style="font-weight:bold; font-size: 14px; margin-bottom: 5px;"></div>
  <div id="estado" class="estado medio">Buscando la hoja…</div>
  
  <!-- Lienzo donde se dibuja la cámara achicada -->
  <canvas id="lienzo"></canvas>
  
  <div class="controles-camara">
    <button id="btnCongelar" style="background:#ff9800" onclick="congelar()">Congelar</button>
    <button onclick="recargar()" style="background:#757575;">Salir</button>
  </div>
  
  <!-- Resultados visibles sin hacer scroll excesivo -->
  <div id="dni"></div>
  <div id="aviso"></div>
  <div id="resumen"></div>
  <div id="rejilla"></div>
  <h4 style="margin: 10px 0 5px 0;">Revisiones:</h4>
  <div id="dudas"></div>
</div>

<video id="video" playsinline muted style="display:none"></video>

<script>
  const URL_API = 'https://script.google.com/macros/s/AKfycbyzwurBcWvUmHXyS70klQhuny8y-9dHyslQHJkeZP90ZfdZpMM8OkMfWz4yamMuymPN7Q/exec';
  const LETRAS = ['A', 'B', 'C', 'D', 'E', 'F'];
  const LADO_MAX = 800; 

  let P = null;
  let activo = false;
  let congelado = false;
  let historial = [];
  let worker = new Worker('lector.js'); 
  let procesando = false;

  const video = document.getElementById('video');
  const lienzo = document.getElementById('lienzo');
  const ctx = lienzo.getContext('2d', { willReadFrequently: true });

  function $(id) { return document.getElementById(id); }
  function msg(t, error) {
    const m = $('mensaje');
    m.textContent = t;
    m.style.color = error ? 'red' : 'green';
  }

  worker.onmessage = function(e) {
    mostrar(e.data.r);
    procesando = false; 
  };

  async function cargarCamaras() {
    try {
      await navigator.mediaDevices.getUserMedia({ video: true });
      const dispositivos = await navigator.mediaDevices.enumerateDevices();
      const camaras = dispositivos.filter(d => d.kind === 'videoinput');
      
      const sel = $('listaCamaras');
      sel.innerHTML = '';
      camaras.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = c.deviceId;
        opt.textContent = c.label || `Lente ${i + 1}`; 
        sel.appendChild(opt);
      });
    } catch (err) {
      $('listaCamaras').innerHTML = '<option value="">Permite la cámara para ver la lista</option>';
    }
  }

  window.addEventListener('load', cargarCamaras);

  async function cargarLista() {
    const pin = $('pin').value;
    msg('Cargando...');
    try {
      const r = await fetch(URL_API + '?pin=' + encodeURIComponent(pin));
      const d = await r.json();
      if (!d.ok) { msg('ERROR: ' + d.error, true); return; }
      const sel = $('examen');
      sel.innerHTML = '';
      d.examenes.forEach(function (x) {
        const o = document.createElement('option');
        o.value = x.id;
        o.textContent = x.nombre + ' (' + x.preguntas + ' preguntas)';
        sel.appendChild(o);
      });
      msg('Exámenes cargados: ' + d.examenes.length);
    } catch (err) {
      msg('FALLÓ: ' + err.name + ' - ' + err.message, true);
    }
  }

  async function iniciar() {
    const pin = $('pin').value;
    const id = $('examen').value;
    const camId = $('listaCamaras').value;

    if (!id) { msg('Primero carga la lista y elige un examen', true); return; }
    msg('Cargando examen...');
    try {
      const r = await fetch(URL_API + '?pin=' + encodeURIComponent(pin) + '&accion=obtener&id=' + encodeURIComponent(id));
      const d = await r.json();
      if (!d.ok) { msg('ERROR: ' + d.error, true); return; }
      P = LECTOR.preparar(HOJA, d.alternativas);
      $('nombreExamen').textContent = d.nombre + ' (' + d.alternativas.length + ' preguntas)';
    } catch (err) {
      msg('FALLÓ: ' + err.name + ' - ' + err.message, true);
      return;
    }

    try {
      const constraints = {
        video: camId ? { deviceId: { exact: camId }, width: { ideal: 1920 } } : { facingMode: 'environment', width: { ideal: 1920 } },
        audio: false
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();
    } catch (err) {
      msg('No se pudo abrir la cámara: ' + err.message, true);
      return;
    }

    $('panelConfig').style.display = 'none';
    $('visor').style.display = 'block';
    activo = true;
    ciclo(); 
  }

  function congelar() {
    congelado = !congelado;
    $('btnCongelar').textContent = congelado ? 'Continuar' : 'Congelar';
    $('btnCongelar').style.background = congelado ? '#2196F3' : '#ff9800';
  }
  
  function recargar() {
    location.reload(); 
  }

  function ciclo() {
    if (!activo) return;
    
    if (!congelado && video.videoWidth) {
      const k = LADO_MAX / Math.max(video.videoWidth, video.videoHeight);
      const w = Math.round(video.videoWidth * k);
      const h = Math.round(video.videoHeight * k);
      
      if (lienzo.width !== w || lienzo.height !== h) { 
        lienzo.width = w; lienzo.height = h; 
      }
      
      ctx.drawImage(video, 0, 0, w, h);
      
      if (!procesando) {
        procesando = true;
        const img = ctx.getImageData(0, 0, w, h);
        worker.postMessage({ accion: 'leer', rgba: img.data, w: w, h: h, P: P }, [img.data.buffer]);
      }
    }
    requestAnimationFrame(ciclo); 
  }

  function dibujarCuadro(q, color, detectado) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 4; // Borde más grueso
    ctx.beginPath();
    q.forEach(function (p, i) { if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); });
    ctx.closePath();
    ctx.stroke();

    // Líneas de guía cruzadas tipo escáner si detectó las esquinas
    if (detectado) {
      ctx.strokeStyle = 'rgba(0, 230, 118, 0.4)'; // Verde semitransparente
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(q[0][0], q[0][1]); ctx.lineTo(q[2][0], q[2][1]); // Diagonal 1
      ctx.moveTo(q[1][0], q[1][1]); ctx.lineTo(q[3][0], q[3][1]); // Diagonal 2
      ctx.stroke();
    }
  }

  function dibujarMarcas(r) {
    // Aumentamos ligeramente el radio visual para que encierre bien la burbuja
    const rad = Math.max(5, (P.radio * r.pxmm) * 1.3); 
    
    function circ(ix, color) {
      const b = P.bub[ix];
      const p = LECTOR.proyectar(r.H, b.x, b.y);
      ctx.strokeStyle = color;
      ctx.lineWidth = 3; // Línea gruesa para los círculos de respuesta
      ctx.beginPath();
      ctx.arc(p[0], p[1], rad, 0, 6.2832);
      ctx.stroke();
    }
    
    function colorear(idxs, estado) {
      idxs.forEach(function (ix) {
        const f = r.f[ix];
        if (f >= LECTOR.T_HI) circ(ix, estado === 'doble' ? '#ff1744' : '#00e676'); // Rojo o verde
        else if (f >= LECTOR.T_LO) circ(ix, '#ff9100'); // Naranja para dudoso
      });
    }
    
    P.dniIdx.forEach(function (idxs, c) { colorear(idxs, r.dni.estados[c]); });
    P.pregIdx.forEach(function (idxs, k) { colorear(idxs, r.respuestas[k].estado); });
  }

  function pintarResultados(r) {
    const dni = $('dni');
    dni.textContent = 'DNI: ' + r.dni.texto;
    dni.style.color = r.dni.completo ? '#2e7d32' : '#c62828';
    $('aviso').textContent = (r.dni.completo ? '' : 'DNI incompleto/doble. ') + 
                             (r.contraste < 0.4 ? 'Poca luz.' : '');
    const s = r.resumen;
    $('resumen').textContent = 'Respuestas: ' + s.ok + ' · Blanco: ' + s.blanco + 
                               ' · Dobles: ' + s.doble;
    let html = '';
    let dudas = '';
    r.respuestas.forEach(function (x) {
      let t, cls;
      if (x.estado === 'ok') { t = LETRAS[x.valor]; cls = 'ok'; }
      else if (x.estado === 'blanco') { t = '—'; cls = 'bl'; }
      else if (x.estado === 'doble') { t = '2×'; cls = 'do'; }
      else { t = LETRAS[x.valor] + '?'; cls = 'du'; }
      html += '<span class="c ' + cls + '"><b>' + x.n + '</b> ' + t + '</span>';
      if (x.estado === 'doble' || x.estado === 'dudosa') {
        dudas += 'P' + x.n + ' ' + x.estado + ': ' + x.f.map(function (v, j) { return LETRAS[j] + ' ' + v.toFixed(2); }).join(' · ') + '\n';
      }
    });
    $('rejilla').innerHTML = html;
    $('dudas').textContent = dudas || 'Ninguna';
  }

  function mostrar(r) {
    const est = $('estado');
    // Le pasamos r.ok para dibujar o no las cruces guía
    if (r.quad) dibujarCuadro(r.quad, r.ok ? '#00e676' : '#ff9100', r.ok);
    
    if (!r.ok) {
      historial = [];
      est.textContent = r.motivo;
      est.className = 'estado malo';
      return;
    }
    historial.push(r.firma);
    if (historial.length > 3) historial.shift();
    const estable = historial.length === 3 && historial.every(function (f) { return f === historial[0]; });
    est.textContent = estable ? 'Lectura estable ✔' : 'Midiendo… mantén quieta la cámara';
    est.className = 'estado ' + (estable ? 'bueno' : 'medio');
    dibujarMarcas(r);
    pintarResultados(r);
  }
</script>
</body>
</html>
